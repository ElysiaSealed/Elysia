# Local development database for ELYSIA only. Do not reuse it for any other project.
# The host port is bound to localhost and differs from the Postgres default to avoid clashing with other local instances.
name: elysia
services:
  postgres:
    container_name: elysia-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia
      POSTGRES_DB: elysia
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - elysia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia -d elysia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  elysia_pgdata:
