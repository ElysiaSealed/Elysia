name: CI

on:
  push:
    branches: [main, dev-rh]
  pull_request:
    branches: [main, dev-rh]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install contract libraries
        run: sh scripts/install-contract-libs.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Script tests
        run: pnpm test:scripts

      - name: Non-DB tests
        run: pnpm test:non-db

      - name: Contract tests
        run: forge test
        working-directory: contracts
